 x="52" y="531" text-anchor="middle" fill="#4338ca" font-size="16" font-weight="700" font-family="Arial">T</text><text x="84" y="519" fill="#0f172a" font-size="15" font-weight="700" font-family="Arial">Tiwoo</text><text x="84" y="541" fill="#697386" font-size="11" font-family="Arial">@tiwoo · yeni</text><text x="31" y="585" fill="#1e293b" font-size="14" font-family="Arial">Altın fiyatını TL bazında izlerken yalnızca ons</text><text x="31" y="608" fill="#1e293b" font-size="14" font-family="Arial">altına bakmak yetmez; USD/TL de gram altını</text><text x="31" y="631" fill="#1e293b" font-size="14" font-family="Arial">etkiler.</text><rect x="12" y="695" width="406" height="150" rx="22" fill="white"/><circle cx="52" cy="735" r="21" fill="#e5e7ff"/><text x="52" y="741" text-anchor="middle" fill="#4338ca" font-size="16" font-weight="700" font-family="Arial">T</text><text x="84" y="729" fill="#0f172a" font-size="15" font-weight="700" font-family="Arial">Tiwoo</text><text x="31" y="792" fill="#1e293b" font-size="14" font-family="Arial">Sade sosyal akış, mesajlaşma, bildirimler ve</text><text x="31" y="815" fill="#1e293b" font-size="14" font-family="Arial">güçlü gizlilik kontrolleri.</text><text x="215" y="900" text-anchor="middle" fill="#635bff" font-size="13" font-weight="700" font-family="Arial">tiwoo.vercel.app</text></svg>