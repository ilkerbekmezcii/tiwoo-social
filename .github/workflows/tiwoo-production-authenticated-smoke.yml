name: Tiwoo authenticated production smoke
on:
  push:
    paths:
      - .github/workflows/tiwoo-production-authenticated-smoke.yml
  workflow_dispatch:

jobs:
  authenticated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Prepare Playwright
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tiwoo-auth-smoke
          cd /tmp/tiwoo-auth-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise live production as a real user
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/tiwoo-auth-smoke/test.mjs <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';

          const RELEASE='20260913r5';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,locale:'tr-TR'});
          const page=await context.newPage();
          const consoleErrors=[];
          const firstPartyServerErrors=[];
          page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
          page.on('pageerror',e=>consoleErrors.push(String(e)));
          page.on('response',r=>{const url=r.url();if(r.status()>=500&&(url.startsWith('https://tiwoo.vercel.app/')||url.startsWith('https://avpjpoywjyhnvbaqxyip.supabase.co/')))firstPartyServerErrors.push({status:r.status(),url})});

          const suffix=(Date.now().toString(36)+Math.random().toString(36).slice(2,6)).slice(-11);
          const username=`e2e_${suffix}`.slice(0,20);
          const password=`T!${Date.now()}a9`;
          const postText=`E2E production smoke ${suffix}`;
          let accountCreated=false;

          async function cleanup(){
            if(!accountCreated)return {skipped:true};
            try{
              return await page.evaluate(async username=>{
                const session=(await window.TiwooSupabase?.sb?.auth?.getSession?.())?.data?.session;
                const token=String(session?.access_token||'');
                const headers={'content-type':'application/json'};
                if(token)headers.authorization=`Bearer ${token}`;
                const r=await fetch('/api/tiwoo-auth',{method:'POST',headers,credentials:'same-origin',cache:'no-store',body:JSON.stringify({action:'account_delete',confirmation:username,acknowledged:true})});
                const d=await r.json().catch(()=>({}));
                return {ok:r.ok&&d?.ok===true,status:r.status,error:d?.error||null};
              },username);
            }catch(error){return {ok:false,error:String(error)}}
          }

          try{
            const response=await page.goto(`https://tiwoo.vercel.app/?authenticated_runner_smoke=${RELEASE}`,{waitUntil:'domcontentloaded',timeout:45000});
            assert(response&&response.status()===200,'production document is not HTTP 200');
            await page.waitForFunction(release=>window.__tiwooRelease===release,RELEASE,{timeout:20000});

            const liveAssets=await page.evaluate(()=>({
              release:window.__tiwooRelease||null,
              authBundle:document.querySelector('script[data-tiwoo-auth-registration]')?.src||'',
              homeReplies:document.querySelector('script[data-tiwoo-home-reply-previews]')?.src||'',
              adminNav:document.querySelector('script[data-tiwoo-admin-nav]')?.src||'',
              recovery:document.querySelector('script[data-tiwoo-recovery-ui]')?.src||''
            }));
            assert.equal(liveAssets.release,RELEASE,'fresh browser did not receive current release marker');
            assert.match(liveAssets.authBundle,/auth-registration\.js.*r=20260913r5/,'auth bundle is not current-release busted');
            assert.match(liveAssets.homeReplies,/home-reply-previews\.js.*20260913v6.*r=20260913r5/,'home reply runtime v6 did not load');
            assert.match(liveAssets.adminNav,/admin-nav\.js.*20260913v8.*r=20260913r5/,'admin mode runtime v8 did not load');

            const staticRuntime=await page.evaluate(async()=>{
              const get=async p=>await (await fetch(p,{cache:'no-store'})).text();
              return {
                home:await get('/home-reply-previews.js?runner=task-chain'),
                recovery:await get('/recovery-ui.js?runner=task-chain'),
                admin:await get('/admin-nav.js?runner=task-chain'),
                adminConsole:await get('/admin-console-v3.js?runner=task-chain')
              };
            });
            assert(staticRuntime.home.includes("window.__tiwooHomeReplyPreviews='2026-09-13-v6'"),'live home reply v6 marker missing');
            assert(staticRuntime.home.includes('data-home-reply-act="reply"')&&staticRuntime.home.includes('data-home-reply-act="share"'),'live home reply action bar missing');
            assert(staticRuntime.home.includes('home-reply-continue-wrap')&&staticRuntime.home.includes('Devamını gör'),'live reply continuation markup missing');
            assert(staticRuntime.recovery.includes("window.__tiwooRecoveryVersion='2026-09-13-v8'"),'live recovery v8 marker missing');
            assert(staticRuntime.admin.includes("window.__tiwooAdminNavLoaded='2026-09-13-split-mode-v3'"),'live admin split-mode marker missing');
            assert(staticRuntime.adminConsole.includes("window.__tiwooAdminConsoleV3='2026-09-13-v1'"),'live admin console v3 marker missing');

            const unauthorizedDispatch=await page.evaluate(async()=>{
              const r=await fetch('https://avpjpoywjyhnvbaqxyip.supabase.co/functions/v1/tiwoo-push-dispatch',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:'wake',message:'runner-auth-check'})});
              return {status:r.status,body:await r.text()};
            });
            assert.equal(unauthorizedDispatch.status,401,'push dispatcher no longer rejects callers without its custom secret');

            await page.locator('#publicRegisterHero').click();
            await page.locator('#tiwooNormalChoice').waitFor({state:'attached',timeout:15000});
            await page.locator('#tiwooNormalChoice').evaluate(el=>el.click());
            await page.locator('#tiwooUsername').waitFor({state:'visible',timeout:10000});
            await page.locator('#authName').fill('Tiwoo E2E');
            await page.locator('#tiwooUsername').fill(username);
            await page.locator('#authPassword').fill(password);
            await page.locator('#authSubmit').click();
            await page.waitForFunction(()=>document.getElementById('app')&&!document.getElementById('app').classList.contains('hidden')&&typeof me!=='undefined'&&me?.handle,{timeout:30000});
            accountCreated=true;
            await page.waitForTimeout(2500);

            const identity=await page.evaluate(()=>({handle:typeof me!=='undefined'?me?.handle:null,isAdmin:typeof me!=='undefined'?!!me?.isAdmin:null}));
            assert.equal(String(identity.handle||'').replace(/^@/,''),username,'registered user session did not become active');
            assert.equal(identity.isAdmin,false,'temporary user unexpectedly has admin privileges');
            assert.equal(await page.locator('[data-admin-mode-toggle]:visible').count(),0,'regular user can see Admin mode');
            assert.equal(await page.locator('[data-management-panel]:visible').count(),0,'regular user can see Management Panel');
            const privilegeScripts=await page.evaluate(()=>[...document.scripts].map(s=>s.src).filter(src=>/inapp-admin-tools|admin-reply-tools/.test(src)));
            assert.equal(privilegeScripts.length,0,'regular user loaded admin privilege scripts');

            const navGeometry=await page.evaluate(()=>{
              const nav=document.getElementById('mobileNav'),r=nav.getBoundingClientRect(),view=document.getElementById('view'),toolbar=document.querySelector('#view>.feed-toolbar');
              return {bottomGap:Math.abs(innerHeight-r.bottom),leftGap:Math.abs(r.left),rightGap:Math.abs(innerWidth-r.right),viewPaddingTop:getComputedStyle(view).paddingTop,toolbarDisplay:toolbar?getComputedStyle(toolbar).display:null};
            });
            assert(navGeometry.bottomGap<=1&&navGeometry.leftGap<=1&&navGeometry.rightGap<=1,'mobile navigation is not flush to viewport edges');
            assert.equal(navGeometry.viewPaddingTop,'0px','home view still has top padding');
            if(navGeometry.toolbarDisplay!==null)assert.equal(navGeometry.toolbarDisplay,'none','hidden home toolbar still occupies space');

            await page.evaluate(()=>go('settings'));
            await page.locator('#resetByMail').waitFor({state:'visible',timeout:10000});
            assert.equal(await page.locator('#resetByMail').isEnabled(),true,'signed-in password reset entry button is disabled');
            await page.locator('#resetByMail').click();
            await page.locator('#forgotModal').waitFor({state:'visible',timeout:10000});
            await page.waitForFunction(()=>window.__tiwooRecoveryVersion==='2026-09-13-v8'&&!document.getElementById('forgotSend')?.disabled,null,{timeout:15000});
            assert.equal((await page.locator('#forgotSend').textContent()).trim(),'Doğrulama kodu gönder','signed-in recovery primary action is wrong');
            await page.locator('[data-close="forgotModal"]').click();
            await page.locator('#forgotModal').waitFor({state:'hidden',timeout:10000});

            await page.evaluate(()=>go('home'));
            await page.locator('#mobileNav [data-compose-mobile]').click();
            await page.locator('#composeText').fill('Luna');
            await page.waitForTimeout(500);
            assert.equal(await page.locator('.mention-popover:visible').count(),0,'plain name triggered automatic user lookup without @');
            await page.locator('#composeText').fill('@lu');
            await page.waitForTimeout(700);
            assert((await page.locator('.mention-popover:visible [data-mention-index]').count())>0,'@handle did not trigger mention lookup');
            await page.locator('#composeText').fill(postText);
            await page.locator('#composeSend').click();

            const root=page.locator('[data-post]').filter({hasText:postText}).first();
            await root.waitFor({state:'visible',timeout:15000});
            const postId=Number(await root.getAttribute('data-post'));
            assert(postId>0,'created post has no id');

            for(let i=1;i<=6;i++){
              const current=page.locator(`[data-post="${postId}"]`).first();
              await current.locator('[data-act="reply"]').click();
              await page.locator('#replyModal').waitFor({state:'visible',timeout:10000});
              await page.locator('#replyModalText').fill(`E2E reply ${i} ${suffix}`);
              await page.locator('#replyModalSend').click();
              await page.locator('#replyModal').waitFor({state:'hidden',timeout:10000});
              await page.waitForTimeout(350);
            }

            await page.evaluate(()=>go('home'));
            const preview=page.locator(`.home-reply-preview[data-home-thread="${postId}"]`);
            await preview.waitFor({state:'visible',timeout:15000});
            assert.equal(await preview.locator('.home-reply-row').count(),5,'home must render exactly five visible reply previews');
            for(const action of ['reply','repost','like','bookmark','share']){
              assert.equal(await preview.locator(`[data-home-reply-act="${action}"]`).count(),5,`missing ${action} action on one or more home reply previews`);
            }
            const continuation=preview.locator('[data-home-continue]');
            await continuation.waitFor({state:'visible'});
            assert.equal((await continuation.textContent()).trim(),'Devamını gör','home reply continuation label is wrong');
            const continuationAfterRows=await preview.evaluate(el=>{
              const rows=[...el.querySelectorAll('.home-reply-row')],more=el.querySelector('.home-reply-continue-wrap');
              if(!rows.length||!more)return false;
              return !!(rows.at(-1).compareDocumentPosition(more)&Node.DOCUMENT_POSITION_FOLLOWING);
            });
            assert.equal(continuationAfterRows,true,'Devamını gör is not after the final visible reply');

            await continuation.click();
            await page.waitForFunction(id=>typeof state!=='undefined'&&state?.view==='detail'&&Number(state?.detail)===id,postId,{timeout:10000});
            await page.locator('.conversation-label').waitFor({state:'visible',timeout:10000});
            assert.match((await page.locator('.conversation-label').textContent())||'',/Yanıtlar\s*·\s*6/,'continuation did not open the complete six-reply thread');
            assert.equal(await page.locator('.reply-card').count(),6,'full thread does not contain all six replies');

            await page.screenshot({path:'/tmp/tiwoo-authenticated-production.png',fullPage:true});
            console.log(JSON.stringify({ok:true,release:RELEASE,usernameRedacted:true,postId,navGeometry,unauthorizedDispatchStatus:unauthorizedDispatch.status,consoleErrors,firstPartyServerErrors},null,2));
            assert.equal(consoleErrors.length,0,`browser console errors detected: ${JSON.stringify(consoleErrors)}`);
            assert.equal(firstPartyServerErrors.length,0,`first-party 5xx responses detected: ${JSON.stringify(firstPartyServerErrors)}`);
          }finally{
            const result=await cleanup();
            console.log('cleanup',JSON.stringify(result));
            await browser.close();
            if(accountCreated)assert.equal(result.ok,true,'temporary production test account cleanup failed');
          }
          EOF
          cd /tmp/tiwoo-auth-smoke
          node test.mjs

      - name: Upload authenticated screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiwoo-authenticated-production-browser
          path: /tmp/tiwoo-authenticated-production.png
          if-no-files-found: ignore
          retention-days: 1
