name: ILET Android Runtime Test

on:
  push:
    branches:
      - ilet-build-temp
    paths:
      - 'ILET/**'
      - '.github/workflows/ilet-runtime-test.yml'

permissions:
  contents: read

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile and lint
        working-directory: ILET
        run: |
          gradle --stacktrace :app:assembleDebug
          gradle --stacktrace :app:lintRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch-test on Android 35
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash .github/scripts/ilet-runtime-test.sh

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilet-lint-report
          path: ILET/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
