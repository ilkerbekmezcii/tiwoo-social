name: ILET Android Runtime Test

on:
  push:
    branches:
      - ilet-build-temp
    paths:
      - 'ILET/**'
      - '.github/workflows/ilet-runtime-test.yml'

permissions:
  contents: read

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile and lint
        working-directory: ILET
        run: |
          gradle --stacktrace :app:assembleDebug
          gradle --stacktrace :app:lintRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch-test on Android 35
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -eu
            adb install -r ILET/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.yakintalk.app android.permission.RECORD_AUDIO || true
            adb shell pm grant com.yakintalk.app android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant com.yakintalk.app android.permission.NEARBY_WIFI_DEVICES || true

            adb logcat -c
            adb shell am force-stop com.yakintalk.app
            adb shell am start -W -n com.yakintalk.app/.MainActivity
            sleep 8

            PID=$(adb shell pidof com.yakintalk.app | tr -d '\r')
            test -n "$PID"
            echo "PASS: ILET process alive after launch: $PID"

            adb logcat -d > /tmp/ilet-logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: com\.yakintalk\.app.*has died|AndroidRuntime.*com\.yakintalk\.app" /tmp/ilet-logcat.txt
            echo "PASS: no fatal runtime exception"

            adb shell dumpsys package com.yakintalk.app > /tmp/ilet-package.txt
            ! grep -q "com.yakintalk.app.IletService" /tmp/ilet-package.txt
            echo "PASS: IletService absent from installed manifest"

            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell dumpsys activity services com.yakintalk.app > /tmp/ilet-services.txt
            ! grep -q "ServiceRecord" /tmp/ilet-services.txt
            echo "PASS: no background service after HOME"

            adb shell am start -W -n com.yakintalk.app/.MainActivity
            sleep 3
            PID2=$(adb shell pidof com.yakintalk.app | tr -d '\r')
            test -n "$PID2"
            echo "PASS: ILET reopened successfully: $PID2"


      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilet-lint-report
          path: ILET/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
