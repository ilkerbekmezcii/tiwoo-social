name: ILET Android Runtime Test

on:
  push:
    branches:
      - ilet-build-temp
    paths:
      - 'ILET/**'
      - '.github/workflows/ilet-runtime-test.yml'

permissions:
  contents: read

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile and lint
        working-directory: ILET
        run: |
          gradle --stacktrace :app:assembleDebug
          gradle --stacktrace :app:lintRelease

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch-test on Android 35
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -eu
            adb install -r ILET/app/build/outputs/apk/debug/app-debug.apk

            adb shell pm grant com.yakintalk.app android.permission.RECORD_AUDIO || true
            adb shell pm grant com.yakintalk.app android.permission.POST_NOTIFICATIONS || true
            adb shell pm grant com.yakintalk.app android.permission.NEARBY_WIFI_DEVICES || true

            adb logcat -c
            adb shell am force-stop com.yakintalk.app
            adb shell am start -W -n com.yakintalk.app/.MainActivity
            sleep 8

            PID="$(adb shell pidof com.yakintalk.app | tr -d '\r')"
            if [ -z "$PID" ]; then
              echo "FAIL: İLET process exited after launch"
              adb logcat -d
              exit 1
            fi
            echo "PASS: İLET process alive, pid=$PID"

            if adb logcat -d | grep -E "FATAL EXCEPTION|Process: com\.yakintalk\.app.*has died|AndroidRuntime.*com\.yakintalk\.app"; then
              echo "FAIL: fatal runtime exception detected"
              adb logcat -d
              exit 1
            fi

            if adb shell dumpsys package com.yakintalk.app | grep -q "com.yakintalk.app.IletService"; then
              echo "FAIL: IletService is still declared in installed manifest"
              exit 1
            fi
            echo "PASS: no IletService declared in installed manifest"

            adb shell input keyevent KEYCODE_HOME
            sleep 3

            if adb shell dumpsys activity services com.yakintalk.app | grep -q "ServiceRecord"; then
              echo "FAIL: background service remained after HOME"
              adb shell dumpsys activity services com.yakintalk.app
              exit 1
            fi
            echo "PASS: no background service after HOME"

            adb shell am start -W -n com.yakintalk.app/.MainActivity
            sleep 3
            PID2="$(adb shell pidof com.yakintalk.app | tr -d '\r')"
            test -n "$PID2"
            echo "PASS: İLET reopened successfully, pid=$PID2"

            adb logcat -d | tail -n 300 > /tmp/ilet-logcat.txt

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ilet-lint-report
          path: ILET/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
