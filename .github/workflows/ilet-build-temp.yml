name: Build ILET 0.2.14

on:
  push:
    branches:
      - ilet-build-temp
    paths:
      - 'ILET/**'
      - '.github/workflows/ilet-build-temp.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK
        working-directory: ILET
        run: gradle --stacktrace :app:assembleRelease

      - name: Package signing tools
        run: |
          mkdir -p signing-tools/lib signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" signing-tools/lib64/
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: ILET-0.2.6-unsigned
          path: ILET/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: signing-tools
          if-no-files-found: error
